<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="tab-list">
            <button class="tab" id="tab_1">Standard</button>
            <button class="tab" id="tab_2">Expert</button>
            <button class="tab" id="tab_3">Elite</button>
            <button class="tab" id="tab_4">Professional</button>
        </div>
        <div class="card-border">
            <div class="content" id="content">
                <div id="heading">Standard</div>
                <img src="" alt="">
                <div class="offers" id="offers">
                    <p>5 Edits</p>
                    <p>1GB Storage</p>
                    <p>3 Website</p>
                    <p>1 Hour free Support</p>
                </div>
                <Button href="#" id="button">Check out for Standard</Button>
            </div>
        </div>
    </div>
</body>
    <script src="script.js"></script>
</html>
