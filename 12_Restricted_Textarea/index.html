<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restricted Textarea</title>
</head>
    <link rel="stylesheet" href="style.css">
<body>
    <div class="container">
        <label for="text">Write your Message</label>
        <br>
        <textarea name="text" id="text" autocapitalize="on" maxlength="250" rows="10" placeholder="type here ..."></textarea>
        <div id="totalWords"><p>0</p><p>/250</p></div>        
    </div>
</body>
    <script src="script.js"></script>
</html>
